business_quality:
  critical_dimension_fail_at_or_below: 1
  critical_dimensions:
  - demand_durability
  - pricing_power
  - moat
  - capital_efficiency
  dimensions:
    capital_efficiency: 5
    cyclicality: 5
    demand_durability: 5
    dependency: 5
    moat: 5
    predictability: 5
    pricing_power: 5
    regulatory_risk: 5
  evidence_coverage:
    high: 0.85
    low_below: 0.7
    medium: 0.7
  evidence_requirements:
    score_4_min_strong_evidence: 2
    score_5_min_strong_evidence: 2
    score_without_strong_evidence_max: 3
  hard_gates:
    core_cash_failure_years: 3
    non_core_profit_ratio_below: 0.5
    single_point_dependency_ratio_above: 0.5
    structural_disruption_revenue_ratio_above: 0.5
    structural_revenue_cagr_below: -0.05
  score_bands:
    a: 32
    fail_below: 24
    pass: 28
    s: 35
    watch: 24
cdc:
  capex_payables_materiality_vs_core_cdc: 0.1
  continuity:
    lookback_years: 5
    min_positive_years: 4
    require_positive_cumulative: true
    require_positive_normalized: true
  interest_classification_materiality_vs_reported_cfo: 0.1
  normalization:
    cyclical_method: full_cycle_median
    cyclical_min_years: 7
    cyclical_preferred_years: 10
    standard_method: min_3y_average_5y_median
  working_capital_distortion_threshold: 0.3
  yield_bands:
    a: 0.1
    fail_below: 0.06
    pass: 0.14
    s: 0.12
    watch: 0.06
confidence:
  levels:
  - HIGH
  - MEDIUM
  - LOW
  low_critical_input_blocks_auto_pass: true
net_cash:
  cash_governance_factor:
    poor_capital_allocation: 0.5
    severe_governance_max: 0.3
    sound: 0.85
    strong: 1.0
    weak_distribution: 0.7
  cash_weights:
    hard_cash: 1.0
    liquid_financial_assets: 0.8
    near_cash: 0.95
    strategic_investments: 0.0
  hybrid_debt_weights:
    debt_like: 1.0
    hybrid: 0.5
    pure_equity_like_max: 0.25
    pure_equity_like_min: 0.0
  leverage:
    fail_above: 2.0
    fail_below: 4.0
    interest_coverage_pass: 8.0
    interest_coverage_watch: 4.0
    max_net_debt_to_ebitda_pass: 1.0
    max_net_debt_to_ebitda_watch: 2.0
  liquidity_coverage:
    a: 1.5
    b: 1.2
    fail_below: 1.0
    s: 2.0
    watch: 1.0
  nci_materiality:
    minority_equity_ratio: 0.2
    minority_profit_ratio: 0.15
  owner_net_cash_ratio_bands:
    a: 0.3
    b: 0.2
    c: 0.0
    s: 0.5
    s_plus: 0.6
  stress:
    cdc_retention_factor: 0.7
    fail_below: 1.0
    ideal_coverage: 2.0
    preferred_coverage: 1.2
  upstreamability_factors:
    fully_accessible: 1.0
    meaningful_constraints: 0.5
    moderate_friction: 0.75
    unavailable: 0.0
profile:
  description: Conservative A/H-share value-investing profile. Hard gates are evaluated independently before valuation. Net cash is treated primarily as a safety margin rather than permission to overpay.
  id: strict-v2
  name: Turtle Value Engine Strict v2
  status: draft
results:
  states:
  - PASS
  - WATCH
  - FAIL
  - SPECIAL_REVIEW
  - ACCEPTABLE
  - TURTLE_ENTRY
  - EXTREME_SAFETY
  - TOO_EXPENSIVE_FOR_STRICT_MODEL
  - NO_NORMAL_VALUATION
through_return:
  distributable_base_method: min_normalized_profit_normalized_cdc
  formal_candidate_threshold: 0.05
  history_years: 5
  normalized_buyback_years: 3
  payout_ratio:
    formal_policy_method: min_policy_floor_5y_median
    no_policy_method: p25_5y
  profit_average_years: 3
  profit_normalization_method: average_3y
  yield_bands:
    a: 0.06
    fail_below: 0.04
    pass: 0.05
    s: 0.08
    watch: 0.04
universe:
  exclude_negative_parent_equity: true
  exclude_special_treatment: true
  min_listing_years_pass: 5
  min_listing_years_watch: 3
  special_models:
  - banks
  - insurance
  - brokers
  - trusts
  - reits
  - property_developers
valuation:
  buyback_cash_credit:
    default_cash: 0.0
    enabled: true
    min_history_years: 3
    require_high_confidence: true
    require_net_diluted_share_reduction: true
  cash_cushion_labels:
    moderate: 0.2
    strong: 0.3
    thick: 0.5
  combine_constraints: min
  negative_adjusted_ev_mode: NET_NET_SPECIAL_CASE
  net_cash_raises_primary_price_ceiling: false
  quality_premium_enabled: false
  risk_free_rate_adjustment_enabled: false
  tiers:
    acceptable:
      cdc_yield: 0.08
      decision: ACCEPTABLE
      recurring_shareholder_cash_yield: 0.05
    extreme_safety:
      cdc_yield: 0.12
      decision: EXTREME_SAFETY
      recurring_shareholder_cash_yield: 0.06
    observation:
      cdc_yield: 0.06
      decision: WATCH
      recurring_shareholder_cash_yield: 0.04
    turtle_entry:
      cdc_yield: 0.1
      decision: TURTLE_ENTRY
      recurring_shareholder_cash_yield: 0.05
