name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Classify PR changes (fail closed)
        id: scope
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/ci_change_scope.py

      - name: Assert CI scope is a known mode
        env:
          CI_SCOPE_MODE: ${{ steps.scope.outputs.mode }}
        run: |
          case "$CI_SCOPE_MODE" in
            full|docs-only|pin-guard-only) echo "CI scope mode: $CI_SCOPE_MODE" ;;
            *) echo "::error::unknown CI scope mode '$CI_SCOPE_MODE'"; exit 1 ;;
          esac

      - name: Install development, API and provenance dependencies
        if: steps.scope.outputs.mode != 'docs-only'
        run: python -m pip install ".[api,dev,provenance]"

      - name: Check workflow action pins
        if: steps.scope.outputs.mode != 'docs-only'
        run: python scripts/check_workflow_action_pins.py

      - name: Run Ruff
        if: steps.scope.outputs.mode != 'docs-only'
        run: python -m ruff check .

      - name: Validate project runtime config template
        if: steps.scope.outputs.mode == 'full'
        run: python -m turtle_value_engine config validate --input config/project.example.toml

      - name: Run deterministic test suite
        if: steps.scope.outputs.mode == 'full'
        run: python -m pytest -n auto --dist loadgroup --durations=30

      - name: Test action pin guard (PR fast path)
        if: steps.scope.outputs.mode == 'pin-guard-only'
        run: python -m pytest tests/test_workflow_action_pins.py --durations=20

      - name: Verify reference monitoring systemd units
        if: steps.scope.outputs.mode == 'full'
        run: |
          systemd-analyze verify deploy/monitoring/turtle-value-monitor.service deploy/monitoring/turtle-value-monitor.timer

      - name: Set up Node
        if: steps.scope.outputs.mode == 'full'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install pnpm
        if: steps.scope.outputs.mode == 'full'
        run: npm install --global pnpm@11.23.0

      - name: Install Dashboard dependencies
        if: steps.scope.outputs.mode == 'full'
        run: pnpm --dir apps/dashboard install --frozen-lockfile

      - name: Check generated OpenAPI
        if: steps.scope.outputs.mode == 'full'
        run: python scripts/export_surface_openapi.py --check

      - name: Check generated Dashboard API types
        if: steps.scope.outputs.mode == 'full'
        run: pnpm --dir apps/dashboard api:check

      - name: Check generated Wrangler types
        if: steps.scope.outputs.mode == 'full'
        run: pnpm --dir apps/dashboard types:check

      - name: Lint Dashboard
        if: steps.scope.outputs.mode == 'full'
        run: pnpm --dir apps/dashboard lint

      - name: Typecheck Dashboard
        if: steps.scope.outputs.mode == 'full'
        run: pnpm --dir apps/dashboard typecheck

      - name: Test Dashboard
        if: steps.scope.outputs.mode == 'full'
        run: pnpm --dir apps/dashboard test --run

      - name: Build Dashboard
        if: steps.scope.outputs.mode == 'full'
        env:
          CLOUDFLARE_API_TOKEN: ci-client-bundle-api-token-sentinel
          SURFACE_API_ACCESS_CLIENT_ID: ci-client-bundle-origin-id-sentinel
          SURFACE_API_ACCESS_CLIENT_SECRET: ci-client-bundle-origin-secret-sentinel
          TVE_DASHBOARD_ACCESS_CLIENT_ID: ci-client-bundle-dashboard-id-sentinel
          TVE_DASHBOARD_ACCESS_CLIENT_SECRET: ci-client-bundle-dashboard-secret-sentinel
        run: pnpm --dir apps/dashboard build

      - name: Check Dashboard client bundle for runtime secrets
        if: steps.scope.outputs.mode == 'full'
        env:
          CLOUDFLARE_API_TOKEN: ci-client-bundle-api-token-sentinel
          SURFACE_API_ACCESS_CLIENT_ID: ci-client-bundle-origin-id-sentinel
          SURFACE_API_ACCESS_CLIENT_SECRET: ci-client-bundle-origin-secret-sentinel
          TVE_DASHBOARD_ACCESS_CLIENT_ID: ci-client-bundle-dashboard-id-sentinel
          TVE_DASHBOARD_ACCESS_CLIENT_SECRET: ci-client-bundle-dashboard-secret-sentinel
        run: pnpm --dir apps/dashboard security:client-bundle

      - name: Validate source Wrangler deployment config
        if: steps.scope.outputs.mode == 'full'
        run: pnpm --dir apps/dashboard exec wrangler deploy --dry-run --config wrangler.jsonc --strict

      - name: Run Dashboard cross-stack smoke
        if: steps.scope.outputs.mode == 'full'
        run: python scripts/dashboard_cross_stack_smoke.py
